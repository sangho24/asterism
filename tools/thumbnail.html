<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>썸네일 원본</title>
<!-- 홍보용 썸네일 1200x630 의 원본. 글자 없이 그래프만 쓴다.
     금색이 읽은 논문, 파랑이 추천 논문, 둘을 잇는 밝은 선이 추천 근거 경로다.
     생성:
       chrome --headless=new --disable-gpu --hide-scrollbars \
         --force-device-scale-factor=1 --window-size=1200,630 \
         --screenshot=assets/thumb.png --virtual-time-budget=6000 \
         "file://$PWD/tools/thumbnail.html?mode=close"
     mode=close 는 경로가 크게 보이는 확대 구도, mode=wide 는 그래프 전체가 성운처럼 보이는 구도 -->
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; background: #0f0f0e; }
  #bg { display: block; width: 1200px; height: 630px; }
</style></head>
<body>
<canvas id="bg" width="2400" height="1260"></canvas>
<script src="../assets/preview-data.js"></script>
<script>
"use strict";
/* 앱(gfx.js)과 같은 별자리 룩으로 만드는 무텍스트 썸네일.
   읽은 논문(금색)에서 추천 논문(파랑)까지의 경로만 밝게 띄워 "왜 추천했는지"를 그림으로 보여준다.
   mode: wide(전체가 들어오는 구도) / close(중앙부 확대) */
const mode = new URLSearchParams(location.search).get("mode") || "wide";
const close = mode === "close";

const C = { bg:"#0f0f0e", node:"#e9e7df", edge:"#f0efe8", gold:"#E5B84A", blue:"#7DA2FF", violet:"#a78bfa" };
const c = document.getElementById("bg"), g = c.getContext("2d");
g.setTransform(2, 0, 0, 2, 0, 0);
const W = 1200, H = 630;

/* 결정적 난수. 매번 같은 그림이 나와야 다시 구울 수 있다 */
let s = 20260915 >>> 0;
const rnd = () => ((s = (s * 1103515245 + 12345) >>> 0) / 4294967296);

g.fillStyle = C.bg; g.fillRect(0, 0, W, H);

/* 성운: 아주 옅게 깔아 깊이만 만든다 */
function nebula(x, y, r, col, a) {
  const gr = g.createRadialGradient(x, y, 0, x, y, r);
  gr.addColorStop(0, "rgba(" + col + "," + a + ")");
  gr.addColorStop(.55, "rgba(" + col + "," + (a * .35) + ")");
  gr.addColorStop(1, "rgba(" + col + ",0)");
  g.fillStyle = gr; g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
}
nebula(W * .33, H * .30, 430, "70,105,210", .15);
nebula(W * .66, H * .68, 430, "190,145,55", .12);
nebula(W * .50, H * .50, 300, "140,120,210", .05);

/* 배경 별먼지 */
for (let i = 0; i < 260; i++) {
  const x = rnd() * W, y = rnd() * H, r = .35 + rnd() * .85;
  g.globalAlpha = .05 + rnd() * .16;
  g.fillStyle = "#ffffff";
  g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
}
g.globalAlpha = 1;

/* 그래프 배치 */
const k = close ? 1080 : 640;
const dx = close ? -70 : -40, dy = close ? -55 : -30;
const ox = W / 2 - k / 2 + dx, oy = H / 2 - (k * CG_PREVIEW.aspect) / 2 + dy;
const X = v => ox + v * k, Y = v => oy + v * k * CG_PREVIEW.aspect;
const N = CG_PREVIEW.n, E = CG_PREVIEW.e;

/* 읽은 것(금색) -> 추천(파랑) 최단 경로를 찾아 그 엣지만 밝게 그린다 */
const adj = N.map(() => []);
for (const [a, b] of E) { adj[a].push(b); adj[b].push(a); }
const pathKey = new Set();
const golds = N.map((n, i) => [n, i]).filter(([n]) => n[3] === 1).map(([, i]) => i);
const goldSet = new Set(golds);
for (let i = 0; i < N.length; i++) {
  if (N[i][3] !== 3) continue;                       // 추천 노드에서 출발
  const prev = new Map([[i, -1]]); const q = [i];
  let hit = -1;
  while (q.length && hit < 0) {
    const cur = q.shift();
    for (const nb of adj[cur]) {
      if (prev.has(nb)) continue;
      prev.set(nb, cur);
      if (goldSet.has(nb)) { hit = nb; break; }
      q.push(nb);
    }
  }
  for (let v = hit; v >= 0 && prev.get(v) >= 0; v = prev.get(v)) {
    const u = prev.get(v);
    pathKey.add(Math.min(u, v) + "-" + Math.max(u, v));
  }
}

/* 일반 엣지: 아주 가는 흰 선 */
g.lineWidth = close ? .9 : .7;
g.strokeStyle = C.edge;
for (const [a, b] of E) {
  if (pathKey.has(Math.min(a, b) + "-" + Math.max(a, b))) continue;
  g.globalAlpha = .13;
  g.beginPath(); g.moveTo(X(N[a][0]), Y(N[a][1])); g.lineTo(X(N[b][0]), Y(N[b][1])); g.stroke();
}

/* 경로 엣지: 금색에서 파랑으로 흐르는 밝은 선 */
g.lineWidth = close ? 2.2 : 1.7;
g.lineCap = "round";
for (const key of pathKey) {
  const [a, b] = key.split("-").map(Number);
  const x1 = X(N[a][0]), y1 = Y(N[a][1]), x2 = X(N[b][0]), y2 = Y(N[b][1]);
  const lg = g.createLinearGradient(x1, y1, x2, y2);
  const ca = N[a][3] === 1 ? C.gold : C.blue, cb = N[b][3] === 1 ? C.gold : C.blue;
  lg.addColorStop(0, ca); lg.addColorStop(1, cb);
  g.strokeStyle = lg; g.globalAlpha = .8;
  g.shadowColor = "rgba(125,162,255,.7)"; g.shadowBlur = 13;
  g.beginPath(); g.moveTo(x1, y1); g.lineTo(x2, y2); g.stroke();
  g.shadowBlur = 0;
}
g.globalAlpha = 1;

/* 별 그리기. 밝은 것만 십자 스파이크를 준다 */
function spike(x, y, len, col, a) {
  g.globalAlpha = a; g.strokeStyle = col; g.lineWidth = .9;
  for (const [dx, dy, L] of [[1,0,len],[0,1,len*.72]]) {
    const lg = g.createLinearGradient(x - dx*L, y - dy*L, x + dx*L, y + dy*L);
    lg.addColorStop(0, "rgba(255,255,255,0)");
    lg.addColorStop(.5, col);
    lg.addColorStop(1, "rgba(255,255,255,0)");
    g.strokeStyle = lg;
    g.beginPath(); g.moveTo(x - dx*L, y - dy*L); g.lineTo(x + dx*L, y + dy*L); g.stroke();
  }
  g.globalAlpha = 1;
}
/* 결정적 밝기 (gfx.js 의 brightness 와 같은 취지) */
const bright = i => .55 + (((i * 2654435761) >>> 0) % 1000) / 1000 * .45;

for (let i = 0; i < N.length; i++) {
  const n = N[i], x = X(n[0]), y = Y(n[1]);
  const base = (0.85 + Math.pow(n[2], .62) * 9.5) * (close ? 1.2 : .95);
  const kind = n[3];
  const col = kind === 1 ? C.gold : kind === 3 ? C.blue : kind === 4 ? C.violet : C.node;
  const key = kind === 1 || kind === 3;
  const r = key ? base * 1.3 + .6 : base;

  if (key) {
    g.shadowColor = kind === 1 ? "rgba(229,184,74,.9)" : "rgba(125,162,255,.9)";
    g.shadowBlur = r * 6;
  } else if (base > 3) {
    g.shadowColor = "rgba(233,231,223,.5)"; g.shadowBlur = r * 2.6;
  }
  g.globalAlpha = key ? 1 : .55 + bright(i) * .4;
  g.fillStyle = col;
  g.beginPath(); g.arc(x, y, r, 0, 6.2832); g.fill();
  g.shadowBlur = 0; g.globalAlpha = 1;

  if (key) spike(x, y, r * 8.5, col, .62);
  else if (base > 1.6) spike(x, y, base * 5.2, "rgba(233,231,223,.85)", .1 + Math.min(.26, base * .045));
}

/* 비네트 */
const vg = g.createRadialGradient(W/2, H/2, Math.min(W,H) * .3, W/2, H/2, Math.max(W,H) * .78);
vg.addColorStop(0, "rgba(0,0,0,0)"); vg.addColorStop(1, "rgba(0,0,0,.55)");
g.fillStyle = vg; g.fillRect(0, 0, W, H);
</script>
</body></html>
